<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFD84D">
<link rel="manifest" href="./manifest.webmanifest">
<title>My Anchor</title>
<style>
:root{
  --yellow:#FFD84D; --orange:#FF9C36; --lime:#9AD650;
  --cream:#FFFDF4; --green:#34764A; --ink:#395548; --line:#E9E1C8;
}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.app{max-width:680px;margin:auto;min-height:100vh;padding:18px 16px 100px}
header{background:linear-gradient(145deg,#FFF3A5,#FFFCEB 60%,#EFF8D1);border:2px solid #FFE27A;border-radius:28px;padding:22px;box-shadow:0 10px 28px #c99d2d18}
.logo{display:inline-block;padding:7px 12px;border:2px dashed #EFC44B;border-radius:999px;background:#fffdf6;color:#3b8747;font-weight:800;font-size:13px;letter-spacing:1px}
h1{margin:14px 0 4px;font-size:28px;color:#338047}
.subtitle{font-size:14px;color:#6f806f}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:16px;box-shadow:0 7px 18px #745d2510}
.card h2{margin:0 0 10px;font-size:20px;color:#367c47}
.soft{font-weight:400;line-height:1.7;color:#647268}
.page{display:none}.page.active{display:block}
.placeholder{padding:32px 10px;text-align:center;color:#819080;line-height:1.8}
.badge{display:inline-block;background:#FFF0B8;color:#9B671C;border-radius:999px;padding:5px 10px;font-size:12px;margin-bottom:8px}
nav{position:fixed;z-index:10;left:50%;bottom:0;transform:translateX(-50%);width:min(680px,100%);display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:#fffdf8eF;border-top:1px solid #e9dfc5;padding:8px 5px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}
nav button{border:0;background:transparent;border-radius:15px;padding:8px 2px 6px;color:#657367;font-size:10px;line-height:1.25}
nav button span{display:block;font-size:21px;margin-bottom:3px}
nav button.active{background:#FFE16A;color:#386d43;font-weight:800}
.challenge-box{text-align:center}
.challenge-label{font-size:15px;font-weight:800;color:#5f735f}
.countdown{font-size:38px;font-weight:900;color:#ef8c2f;margin:8px 0}
.route{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;font-weight:800;color:#477451}
.route .arrow{color:#ef9d35}
.form-row{display:grid;gap:7px;margin:13px 0}
.form-row label{font-weight:800;color:#477451}
input[type=date]{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid #ddd3b8;border-radius:14px;background:#fff}
.save-btn{width:100%;border:0;border-radius:15px;padding:13px;background:#FFD84D;color:#426446;font-size:16px;font-weight:900}
.saved{min-height:22px;text-align:center;margin-top:9px;color:#4e8b58;font-size:13px}
.basic-today{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.score-input{width:76px;font:inherit;font-size:18px;font-weight:800;text-align:center;padding:10px;border:1px solid #ddd3b8;border-radius:13px;background:#fff}
.mini-save{border:0;border-radius:13px;padding:11px 13px;background:#FFD84D;color:#426446;font-weight:900}#todayBasicCheck{font-weight:900;color:#4e8b58}.basic-result{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:16px;align-items:center;padding:12px 8px 4px}
.basic-score-box{min-height:88px;border:2px solid #f0dfb8;border-radius:24px;display:flex;align-items:center;justify-content:center;background:#fffdf8;color:#3f7f4d;font-size:34px;font-weight:900}
.basic-plant-badge{width:104px;height:104px;border:10px solid #f7c93e;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;justify-self:center;box-shadow:0 4px 12px rgba(239,183,42,.12)}
.basic-plant-badge span{font-size:48px;line-height:1}
.month-nav{display:grid;grid-template-columns:46px 1fr 46px;align-items:center;gap:8px;margin-bottom:12px}
.month-nav button{border:0;border-radius:13px;background:#FFF0B8;padding:10px;font-size:18px}
.month-title{text-align:center;font-size:19px;font-weight:900;color:#367c47}
.basic-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}
.basic-table th,.basic-table td{border-bottom:1px solid #eee5ce;padding:8px 4px;text-align:center;vertical-align:middle}
.basic-table th{color:#607460;font-size:12px}
.basic-table .date-col{width:22%}.basic-table .score-col{width:18%}.basic-table .entry-col{width:46%}.basic-table .mark-col{width:14%}
.inline-entry{display:flex;justify-content:center;align-items:center;gap:4px}
.inline-entry input{width:48px;min-width:0;font:inherit;text-align:center;padding:7px 3px;border:1px solid #ddd3b8;border-radius:9px}
.inline-entry button{border:0;border-radius:9px;padding:7px 6px;background:#FFF0B8;color:#596b52;font-weight:800;font-size:11px}
.done-score{font-weight:900;color:#3f7f4d}
.screen-title{display:flex;align-items:center;gap:9px;margin:20px 2px 8px;font-size:24px;font-weight:900;color:#357b48}


  /* v4.1.4 基礎トレ一覧の視認性 */
  #basic table{font-size:19px}
  #basic th{font-size:18px}
  #basic td{font-size:19px}
  #basic .inline-entry input{font-size:19px}
  #basic .inline-entry button{font-size:17px}
  #basic tbody td:last-child{font-size:27px}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo">⚓ MY ANCHOR ✨</div>
  <h1 id="roomTitle">勉強部屋 🌱</h1>
  <div class="subtitle">できない日があっても、また始めればいい。</div>
</header>

<section id="today" class="page active">
  <div class="screen-title">🏠 今日</div>
  <div class="card challenge-box">
    <div class="challenge-label">次のチャレテまで</div>
    <div id="countdown" class="countdown">日付を設定してね 🌱</div>
    <div class="route">
      <span id="startDisplay">出発 —</span>
      <span class="arrow">→</span>
      <span id="goalDisplay">GOAL ✨ —</span>
    </div>
  </div>
  <div class="card">
    <h2 id="todayBasicTitle">⚓ 基礎トレ</h2>
    <div id="todayBasicEntry" class="basic-today">
      <input id="todayBasicScore" class="score-input" type="number" min="0" max="10" inputmode="numeric">
      <span>点</span>
      <button id="saveTodayBasic" class="mini-save" type="button">保存</button>
      <span id="todayBasicCheck" aria-live="polite"></span>
    </div>
    <div id="todayBasicResult" class="basic-result" hidden>
      <div class="basic-score-box"><span id="todayBasicScoreText"></span></div>
      <div class="basic-plant-badge"><span id="todayBasicPlant"></span></div>
    </div>
  </div>
</section>

<section id="tasks" class="page">
  <div class="screen-title">📚 やること</div>
  <div class="card placeholder">やること画面<br>— ベース完成 —</div>
</section>

<section id="challenge" class="page">
  <div class="screen-title">📘 チャレテ</div>
  <div class="card placeholder">チャレテ画面<br>— ベース完成 —</div>
</section>

<section id="basic" class="page">
  <div class="screen-title">⚓ 基礎トレ</div>
  <div class="card">
    <div class="month-nav">
      <button id="basicPrevMonth" type="button" aria-label="前の月">‹</button>
      <div id="basicMonthTitle" class="month-title"></div>
      <button id="basicNextMonth" type="button" aria-label="次の月">›</button>
    </div>
    <table class="basic-table">
      <thead>
        <tr>
          <th class="date-col">日付</th>
          <th class="score-col">点数</th>
          <th class="entry-col">入力・保存</th>
          <th class="mark-col"></th>
        </tr>
      </thead>
      <tbody id="basicRows"></tbody>
    </table>
  </div>
</section>

<section id="sapix" class="page">
  <div class="screen-title">🎒 サピックス</div>
  <div class="card placeholder">サピックス画面<br>— ベース完成 —</div>
</section>

<section id="mother" class="page">
  <div class="screen-title">🌿 お母さん</div>
  <div class="card">
    <h2>📅 チャレテの日付設定</h2>
    <div class="soft">出発日とチャレテ本番日を設定します。</div>
    <div class="form-row">
      <label for="startDate">出発日</label>
      <input id="startDate" type="date">
    </div>
    <div class="form-row">
      <label for="goalDate">チャレテ本番日</label>
      <input id="goalDate" type="date">
    </div>
    <button id="saveDates" class="save-btn" type="button">保存</button>
    <div id="saveMessage" class="saved"></div>
  </div>
</section>

<section id="ticket" class="page">
  <div class="screen-title">🎟️ チケット</div>
  <div class="card placeholder">チケット画面<br>— ベース完成 —</div>
</section>
</div>

<nav id="nav">
<button class="active" data-page="today"><span>🏠</span>今日</button>
<button data-page="tasks"><span>📚</span>やること</button>
<button data-page="challenge"><span>📘</span>チャレテ</button>
<button data-page="basic"><span>⚓</span>基礎トレ</button>
<button data-page="sapix"><span>🎒</span>サピックス</button>
<button data-page="mother"><span>🌿</span>お母さん</button>
<button data-page="ticket"><span>🎟️</span>チケット</button>
</nav>

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "myAnchorV2.challengeDates";
  const buttons = [...document.querySelectorAll("#nav button")];
  const pages = [...document.querySelectorAll(".page")];

  function openPage(id, button){
    pages.forEach(page => page.classList.toggle("active", page.id === id));
    buttons.forEach(btn => btn.classList.toggle("active", btn === button));
    window.scrollTo(0, 0);
  }

  buttons.forEach(button => {
    button.addEventListener("click", () => openPage(button.dataset.page, button));
  });

  function readDates(){
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      return {
        start: typeof data.start === "string" ? data.start : "",
        goal: typeof data.goal === "string" ? data.goal : ""
      };
    } catch (e) {
      return {start:"", goal:""};
    }
  }

  function parseLocalDate(value){
    const parts = value.split("-").map(Number);
    if(parts.length !== 3 || parts.some(Number.isNaN)) return null;
    return new Date(parts[0], parts[1]-1, parts[2]);
  }

  function formatMD(value){
    const d = parseLocalDate(value);
    return d ? `${d.getMonth()+1}月${d.getDate()}日` : "—";
  }

  function todayAtMidnight(){
    const now = new Date();
    return new Date(now.getFullYear(), now.getMonth(), now.getDate());
  }

  function renderDates(){
    const dates = readDates();
    document.getElementById("startDate").value = dates.start;
    document.getElementById("goalDate").value = dates.goal;
    document.getElementById("startDisplay").textContent =
      dates.start ? `出発 ${formatMD(dates.start)}` : "出発 —";
    document.getElementById("goalDisplay").textContent =
      dates.goal ? `GOAL ✨ ${formatMD(dates.goal)}` : "GOAL ✨ —";

    const countdown = document.getElementById("countdown");
    if(!dates.goal){
      countdown.textContent = "日付を設定してね 🌱";
      return;
    }

    const goal = parseLocalDate(dates.goal);
    const diff = Math.ceil((goal - todayAtMidnight()) / 86400000);
    if(diff > 0) countdown.textContent = `あと${diff}日！`;
    else if(diff === 0) countdown.textContent = "今日がチャレテ！";
    else countdown.textContent = "チャレテ終了 🌸";
  }

  document.getElementById("saveDates").addEventListener("click", () => {
    const start = document.getElementById("startDate").value;
    const goal = document.getElementById("goalDate").value;
    const message = document.getElementById("saveMessage");

    if(!start || !goal){
      message.textContent = "出発日と本番日の両方を入れてね。";
      return;
    }
    if(parseLocalDate(start) > parseLocalDate(goal)){
      message.textContent = "出発日は本番日より前にしてね。";
      return;
    }

    localStorage.setItem(STORAGE_KEY, JSON.stringify({start, goal}));
    message.textContent = "保存しました ✓";
    renderDates();
  });


  // ---- 基礎トレ：この機能専用の保存領域 ----
  const BASIC_STORAGE_KEY = "myAnchorV2.basicScores";
  let basicViewDate = new Date();
  basicViewDate = new Date(basicViewDate.getFullYear(), basicViewDate.getMonth(), 1);

  function dateKey(year, monthIndex, day){
    return `${year}-${String(monthIndex+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
  }

  function todayKey(){
    const now = new Date();
    return dateKey(now.getFullYear(), now.getMonth(), now.getDate());
  }

  function readBasicScores(){
    try{
      const data = JSON.parse(localStorage.getItem(BASIC_STORAGE_KEY) || "{}");
      return data && typeof data === "object" ? data : {};
    }catch(e){
      return {};
    }
  }

  function writeBasicScores(scores){
    localStorage.setItem(BASIC_STORAGE_KEY, JSON.stringify(scores));
  }

  function validBasicScore(value){
    if(value === "") return null;
    const score = Number(value);
    if(!Number.isInteger(score) || score < 0 || score > 10) return null;
    return score;
  }

  function basicPlant(score){
    if(score === 10) return "🌸";
    if(score >= 8) return "🌷";
    if(score >= 4) return "🪴";
    return "🌱";
  }

  function saveBasicScore(key, rawValue, messageElement){
    const score = validBasicScore(rawValue);
    if(score === null){
      if(messageElement) messageElement.textContent = "0〜10の整数で入れてね。";
      return false;
    }
    const scores = readBasicScores();
    scores[key] = score;
    writeBasicScores(scores);
    if(messageElement) messageElement.textContent = `${score}点で保存しました ✓`;
    renderTodayBasic();
    renderBasicMonth();
    return true;
  }

  function renderTodayBasic(){
    const now = new Date();
    const scores = readBasicScores();
    const key = todayKey();
    const hasScore = Object.prototype.hasOwnProperty.call(scores,key);
    const entry = document.getElementById("todayBasicEntry");
    const result = document.getElementById("todayBasicResult");

    document.getElementById("todayBasicTitle").textContent =
      `⚓ 基礎トレ：${now.getMonth()+1}月${now.getDate()}日`;

    entry.hidden = hasScore;
    result.hidden = !hasScore;
    document.getElementById("todayBasicScoreText").textContent = hasScore ? `${scores[key]}点` : "";
    document.getElementById("todayBasicPlant").textContent = hasScore ? basicPlant(scores[key]) : "";
  }

  document.getElementById("saveTodayBasic").addEventListener("click",()=>{
    const input = document.getElementById("todayBasicScore");
    const check = document.getElementById("todayBasicCheck");
    const score = validBasicScore(input.value);
    if(score === null){
      check.textContent = " 0〜10で入力";
      return;
    }
    check.textContent = "";
    if(saveBasicScore(todayKey(), input.value, null)){
      input.value = "";
    }
  });

  function renderBasicMonth(){
    const year = basicViewDate.getFullYear();
    const month = basicViewDate.getMonth();
    const days = new Date(year, month+1, 0).getDate();
    const scores = readBasicScores();
    const today = todayAtMidnight();

    document.getElementById("basicMonthTitle").textContent = `${year}年${month+1}月`;
    const tbody = document.getElementById("basicRows");
    tbody.innerHTML = "";

    for(let day=1; day<=days; day++){
      const key = dateKey(year,month,day);
      const hasScore = Object.prototype.hasOwnProperty.call(scores,key);
      const rowDate = new Date(year,month,day);
      const isPastOrToday = rowDate <= today;

      const tr = document.createElement("tr");

      const tdDate = document.createElement("td");
      tdDate.textContent = `${month+1}/${day}`;

      const tdScore = document.createElement("td");
      tdScore.className = hasScore ? "done-score" : "";
      tdScore.textContent = hasScore ? `${scores[key]}` : "—";

      const tdEntry = document.createElement("td");
      if(isPastOrToday){
        const wrap = document.createElement("div");
        wrap.className = "inline-entry";
        const input = document.createElement("input");
        input.type = "number";
        input.min = "0";
        input.max = "10";
        input.inputMode = "numeric";
        input.value = "";
        input.setAttribute("aria-label", `${month+1}月${day}日の点数`);
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = hasScore ? "修正" : "保存";
        button.addEventListener("click",()=>{
          if(saveBasicScore(key,input.value,null)) renderBasicMonth();
        });
        wrap.append(input,button);
        tdEntry.appendChild(wrap);
      }else{
        tdEntry.textContent = "";
      }

      const tdMark = document.createElement("td");
      tdMark.textContent = isPastOrToday ? (hasScore ? basicPlant(scores[key]) : "−") : "";

      tr.append(tdDate,tdScore,tdEntry,tdMark);
      tbody.appendChild(tr);
    }
  }

  document.getElementById("basicPrevMonth").addEventListener("click",()=>{
    basicViewDate = new Date(basicViewDate.getFullYear(), basicViewDate.getMonth()-1, 1);
    renderBasicMonth();
  });

  document.getElementById("basicNextMonth").addEventListener("click",()=>{
    basicViewDate = new Date(basicViewDate.getFullYear(), basicViewDate.getMonth()+1, 1);
    renderBasicMonth();
  });

  renderDates();
  renderTodayBasic();
  renderBasicMonth();
})();

if("serviceWorker" in navigator){
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
</body>
</html>
